[project]
name = "cs2skins"
version = "1.0.0"
description = "CS2 Skins - Case opening and upgrade site with market.csgo.com integration"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "pyjwt>=2.12.1",
    "bcrypt>=4.2.1",
]

[tool.uvicorn]
app = "backend.main:app"
host = "0.0.0.0"
port = 8000
reload = true
